<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RFID 資料儀表板</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #21262d;
      --border: rgba(48, 54, 61, 0.8);
      --text: #e6edf3;
      --text2: #8b949e;
      --accent: #00d9a3;
      --accent2: #0096ff;
      --accent3: #f78166;
      --font: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }

    /* ── 頂部 Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-icon svg { width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 1.5; }

    h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: var(--text); }
    .subtitle { font-size: 11px; color: var(--text2); margin-top: 2px; }

    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 11px;
      color: var(--text2);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── 主要內容 ── */
    main {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── 上傳區 ── */
    .upload-zone {
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 2rem;
      background: var(--bg2);
    }

    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(0, 217, 163, 0.04);
    }

    .upload-zone.has-data {
      display: none;
    }

    .upload-icon svg { width: 40px; height: 40px; stroke: var(--text2); fill: none; stroke-width: 1.2; margin-bottom: 1rem; }
    .upload-title { font-size: 14px; color: var(--text); margin-bottom: 6px; }
    .upload-hint { font-size: 12px; color: var(--text2); }

    .upload-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 20px;
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-family: var(--font);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .upload-btn:hover { background: rgba(0,217,163,0.1); }

    #file-input { display: none; }

    /* ── 統計卡片 ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }

    .stat-value.green { color: var(--accent); }
    .stat-value.blue  { color: var(--accent2); }
    .stat-value.red   { color: var(--accent3); }
    .stat-value.white { color: var(--text); }

    .stat-sub {
      font-size: 11px;
      color: var(--text2);
      margin-top: 6px;
    }

    /* ── 面板區 ── */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 2rem;
    }

    @media (max-width: 768px) { .panels { grid-template-columns: 1fr; } }

    .panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header span { color: var(--accent); }

    /* ── UID 統計清單 ── */
    .uid-list { padding: 8px; }

    .uid-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .uid-row:hover { background: var(--bg3); }
    .uid-row.active { background: rgba(0,217,163,0.08); }

    .uid-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.1em;
      min-width: 90px;
      text-align: center;
    }

    .uid-name { flex: 1; font-size: 12px; color: var(--text); }
    .uid-count { font-size: 20px; font-weight: 700; min-width: 28px; text-align: right; }

    .uid-bar-wrap { position: relative; height: 3px; background: var(--bg3); border-radius: 2px; flex: 1; }
    .uid-bar { height: 3px; border-radius: 2px; transition: width 0.4s ease; }

    /* ── 時間軸圖表 ── */
    #timeline-chart { display: block; width: 100%; }

    /* ── 資料表格 ── */
    .table-section {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .table-toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .table-title {
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex: 1;
    }

    .search-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      width: 200px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--text2); }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead th {
      padding: 10px 16px;
      text-align: left;
      font-size: 10px;
      color: var(--text2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    thead th:hover { color: var(--text); }

    tbody tr {
      border-bottom: 1px solid rgba(48, 54, 61, 0.4);
      transition: background 0.1s;
      cursor: pointer;
    }
    tbody tr:hover { background: var(--bg3); }
    tbody tr.highlighted { background: rgba(0,217,163,0.05); }

    td {
      padding: 10px 16px;
      vertical-align: middle;
    }

    .idx-badge {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      color: var(--text2);
    }

    .uid-chip {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 4px;
      letter-spacing: 0.1em;
    }

    .time-text { color: var(--text); }
    .millis-text { color: var(--text2); font-size: 11px; }

    /* ── 空白狀態 ── */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text2);
      font-size: 12px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 12px;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; }

    .reset-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text2);
      font-family: var(--font);
      font-size: 11px;
      padding: 4px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .reset-btn:hover { border-color: var(--accent3); color: var(--accent3); }

    #dashboard { display: none; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3"/></svg>
    </div>
    <div>
      <h1>RFID DATA LOGGER</h1>
      <div class="subtitle">JSON 資料視覺化儀表板</div>
    </div>
  </div>
  <div class="status-pill">
    <div class="status-dot"></div>
    <span id="status-text">等待資料</span>
  </div>
</header>

<main>

  <!-- 上傳區 -->
  <div class="upload-zone" id="upload-zone">
    <div class="upload-icon">
      <svg viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/><polyline points="7 9 12 4 17 9"/><line x1="12" y1="4" x2="12" y2="16"/></svg>
    </div>
    <div class="upload-title">載入 rfid_data.json</div>
    <div class="upload-hint">拖曳 JSON 檔案至此，或點擊選擇檔案</div>
    <label class="upload-btn" for="file-input">選擇檔案</label>
    <input type="file" id="file-input" accept=".json" />
    <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px;">
      <div class="upload-hint" style="margin-bottom: 8px;">或載入範例資料</div>
      <button class="upload-btn" id="load-demo-btn" style="margin-top: 0;">載入 Demo 資料</button>
    </div>
  </div>

  <!-- 主儀表板 -->
  <div id="dashboard">

    <!-- 工具列 -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem;">
      <div style="font-size:12px; color:var(--text2);" id="file-info"></div>
      <button class="reset-btn" id="reset-btn">↺ 重新載入</button>
    </div>

    <!-- 統計卡片 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">總掃描次數</div>
        <div class="stat-value green" id="stat-total">0</div>
        <div class="stat-sub">筆記錄</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">不重複卡片</div>
        <div class="stat-value blue" id="stat-unique">0</div>
        <div class="stat-sub">張 RFID 卡</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">最後掃描</div>
        <div class="stat-value white" style="font-size:16px;" id="stat-last-uid">—</div>
        <div class="stat-sub" id="stat-last-time">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">最高頻率卡</div>
        <div class="stat-value white" style="font-size:16px;" id="stat-top-uid">—</div>
        <div class="stat-sub" id="stat-top-count">—</div>
      </div>
    </div>

    <!-- 面板區 -->
    <div class="panels">
      <!-- UID 統計 -->
      <div class="panel">
        <div class="panel-header">
          UID 卡片統計
          <span id="uid-count-badge">0 張</span>
        </div>
        <div class="uid-list" id="uid-list"></div>
      </div>

      <!-- 時間軸圖表 -->
      <div class="panel">
        <div class="panel-header">掃描時間分布</div>
        <div style="padding: 16px;">
          <canvas id="timeline-chart" height="200" role="img" aria-label="RFID 掃描時間分布圖"></canvas>
        </div>
      </div>
    </div>

    <!-- 資料表格 -->
    <div class="table-section">
      <div class="table-toolbar">
        <div class="table-title">原始資料</div>
        <input class="search-box" type="text" id="search-input" placeholder="搜尋 UID…" />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>UID</th>
              <th>時間戳記</th>
              <th>Arduino Millis</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /dashboard -->
</main>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DEMO_DATA = [
  {"index":0,"uid":"A3F2C1B0","millis":3200,"timestamp":"2026-05-20T10:30:00.123456+08:00"},
  {"index":1,"uid":"B7D4E2A1","millis":15800,"timestamp":"2026-05-20T10:31:15.654321+08:00"},
  {"index":2,"uid":"A3F2C1B0","millis":45200,"timestamp":"2026-05-20T10:34:22.001234+08:00"},
  {"index":3,"uid":"C9A1F3D2","millis":72500,"timestamp":"2026-05-20T10:37:45.789012+08:00"},
  {"index":4,"uid":"D5B8E0C4","millis":103100,"timestamp":"2026-05-20T10:41:58.345678+08:00"},
  {"index":5,"uid":"B7D4E2A1","millis":134700,"timestamp":"2026-05-20T10:46:11.902345+08:00"},
  {"index":6,"uid":"A3F2C1B0","millis":162300,"timestamp":"2026-05-20T10:50:33.123456+08:00"},
  {"index":7,"uid":"C9A1F3D2","millis":198000,"timestamp":"2026-05-20T10:55:18.456789+08:00"},
  {"index":8,"uid":"E2D7A3F1","millis":225600,"timestamp":"2026-05-20T11:00:45.789012+08:00"},
  {"index":9,"uid":"A3F2C1B0","millis":258900,"timestamp":"2026-05-20T11:05:09.012345+08:00"}
];

// ─── 顏色池 ────────────────────────────────────────────
const COLOR_POOL = [
  { bg: 'rgba(0,217,163,0.15)', border: '#00d9a3', text: '#00d9a3' },
  { bg: 'rgba(0,150,255,0.15)', border: '#0096ff', text: '#0096ff' },
  { bg: 'rgba(247,129,102,0.15)', border: '#f78166', text: '#f78166' },
  { bg: 'rgba(210,153,255,0.15)', border: '#d299ff', text: '#d299ff' },
  { bg: 'rgba(255,215,0,0.15)', border: '#ffd700', text: '#ffd700' },
  { bg: 'rgba(100,220,255,0.15)', border: '#64dcff', text: '#64dcff' },
];

let allData = [];
let uidColors = {};
let activeUID = null;
let chartInstance = null;
let colorIdx = 0;

function getColor(uid) {
  if (!uidColors[uid]) uidColors[uid] = COLOR_POOL[colorIdx++ % COLOR_POOL.length];
  return uidColors[uid];
}

function showToast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function formatTimestamp(ts) {
  if (!ts) return '—';
  try {
    const d = new Date(ts);
    return d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch { return ts; }
}

function formatMillis(ms) {
  if (ms === undefined) return '—';
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return `${h}h ${m % 60}m ${s % 60}s`;
  if (m > 0) return `${m}m ${s % 60}s`;
  return `${s}s`;
}

// ─── 渲染統計卡片 ────────────────────────────────────
function renderStats(data) {
  const uids = [...new Set(data.map(d => d.uid))];
  document.getElementById('stat-total').textContent = data.length;
  document.getElementById('stat-unique').textContent = uids.length;

  const last = data[data.length - 1];
  document.getElementById('stat-last-uid').textContent = last ? last.uid : '—';
  document.getElementById('stat-last-time').textContent = last ? formatTimestamp(last.timestamp) : '—';

  const counts = {};
  data.forEach(d => counts[d.uid] = (counts[d.uid] || 0) + 1);
  const topUID = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];
  document.getElementById('stat-top-uid').textContent = topUID ? topUID[0] : '—';
  document.getElementById('stat-top-count').textContent = topUID ? `掃描 ${topUID[1]} 次` : '—';
}

// ─── 渲染 UID 清單 ───────────────────────────────────
function renderUIDList(data) {
  const counts = {};
  data.forEach(d => counts[d.uid] = (counts[d.uid] || 0) + 1);
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const max = sorted[0]?.[1] || 1;

  document.getElementById('uid-count-badge').textContent = `${sorted.length} 張`;

  const el = document.getElementById('uid-list');
  el.innerHTML = sorted.map(([uid, cnt]) => {
    const c = getColor(uid);
    const pct = Math.round((cnt / max) * 100);
    return `
    <div class="uid-row ${activeUID === uid ? 'active' : ''}" onclick="toggleUID('${uid}')">
      <span class="uid-badge" style="background:${c.bg}; color:${c.text}; border: 1px solid ${c.border};">${uid}</span>
      <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:11px; color:var(--text2);">掃描 ${cnt} 次</span>
          <span class="uid-count" style="color:${c.text}; font-size:16px;">${cnt}</span>
        </div>
        <div class="uid-bar-wrap">
          <div class="uid-bar" style="width:${pct}%; background:${c.border};"></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ─── 渲染時間軸圖表 ──────────────────────────────────
function renderChart(data) {
  const ctx = document.getElementById('timeline-chart').getContext('2d');
  if (chartInstance) chartInstance.destroy();

  const uids = [...new Set(data.map(d => d.uid))];
  const datasets = uids.map(uid => {
    const c = getColor(uid);
    const points = data
      .filter(d => d.uid === uid)
      .map(d => ({ x: d.millis / 1000, y: uid }));
    return {
      label: uid,
      data: points,
      borderColor: c.border,
      backgroundColor: c.bg,
      pointRadius: 7,
      pointHoverRadius: 10,
      showLine: false,
    };
  });

  chartInstance = new Chart(ctx, {
    type: 'scatter',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: {
          label: ctx => `${ctx.dataset.label} @ ${ctx.parsed.x.toFixed(1)}s`
        }
      }},
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: '秒（Arduino millis）', color: '#8b949e', font: { size: 11 } },
          ticks: { color: '#8b949e', font: { size: 10 } },
          grid: { color: 'rgba(48,54,61,0.5)' }
        },
        y: {
          type: 'category',
          labels: uids.reverse(),
          ticks: { color: '#8b949e', font: { size: 10, family: 'JetBrains Mono, monospace' } },
          grid: { color: 'rgba(48,54,61,0.5)' }
        }
      }
    }
  });
}

// ─── 渲染資料表格 ────────────────────────────────────
function renderTable(data) {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = q ? data.filter(d => d.uid.toLowerCase().includes(q)) : data;

  const tbody = document.getElementById('table-body');
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">沒有符合的資料</div></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(d => {
    const c = getColor(d.uid);
    const hi = activeUID && d.uid === activeUID ? 'highlighted' : '';
    return `
    <tr class="${hi}" onclick="toggleUID('${d.uid}')">
      <td><span class="idx-badge">${d.index}</span></td>
      <td><span class="uid-chip" style="background:${c.bg}; color:${c.text}; border:1px solid ${c.border};">${d.uid}</span></td>
      <td><span class="time-text">${formatTimestamp(d.timestamp)}</span></td>
      <td><span class="millis-text">${formatMillis(d.millis)} (${d.millis}ms)</span></td>
    </tr>`;
  }).join('');
}

// ─── 切換 UID 篩選 ───────────────────────────────────
function toggleUID(uid) {
  activeUID = activeUID === uid ? null : uid;
  renderUIDList(allData);
  renderTable(allData);
}

// ─── 載入資料 ────────────────────────────────────────
function loadData(data, filename) {
  allData = data;
  uidColors = {};
  colorIdx = 0;
  activeUID = null;

  document.getElementById('upload-zone').classList.add('has-data');
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('file-info').textContent = `${filename}  ·  ${data.length} 筆記錄`;
  document.getElementById('status-text').textContent = `已載入 ${data.length} 筆`;

  renderStats(data);
  renderUIDList(data);
  renderChart(data);
  renderTable(data);

  showToast(`✓ 成功載入 ${data.length} 筆 RFID 資料`);
}

// ─── 事件綁定 ────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      loadData(Array.isArray(data) ? data : [data], file.name);
    } catch { showToast('❌ JSON 格式錯誤，請確認檔案'); }
  };
  reader.readAsText(file);
});

const zone = document.getElementById('upload-zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try { loadData(JSON.parse(ev.target.result), file.name); }
    catch { showToast('❌ JSON 格式錯誤'); }
  };
  reader.readAsText(file);
});

document.getElementById('load-demo-btn').addEventListener('click', () => {
  loadData(DEMO_DATA, 'demo_data.json');
});

document.getElementById('reset-btn').addEventListener('click', () => {
  allData = []; uidColors = {}; colorIdx = 0; activeUID = null;
  document.getElementById('upload-zone').classList.remove('has-data');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('status-text').textContent = '等待資料';
  document.getElementById('file-input').value = '';
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
});

document.getElementById('search-input').addEventListener('input', () => renderTable(allData));
</script>
</body>
</html>
